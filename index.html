/* v1.1 — desktop-first compact workbench for approximately 1200 × 800 */

header .brand{font-size:18px}
header .brand svg{width:28px;height:28px}
main{max-width:1600px;margin:10px auto;padding:0 12px;grid-template-columns:minmax(0,1.25fr) minmax(330px,.82fr);gap:12px;min-height:0;height:calc(100dvh - 68px)}
.panel{padding:12px;min-height:0;display:flex;flex-direction:column;gap:0;overflow:auto}
.panel h2{font-size:14px;margin:0 0 8px;flex-shrink:0}
.toolbar{gap:6px;margin-bottom:8px;flex-shrink:0}
.btn{padding:7px 10px;font-size:12px}
.preview-wrap{height:clamp(205px,calc(100dvh - 330px),510px);min-height:0;flex:1 1 auto;padding:9px}

.templates{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 7px;scroll-snap-type:x proximity;flex-shrink:0;scrollbar-width:thin}
.template{flex:0 0 118px;min-width:0;min-height:59px;gap:5px;padding:5px;flex-direction:row;scroll-snap-align:start;font-size:10px;line-height:1.2}

.settings-block[open] summary{border-bottom:1px solid #e5ebf1}
.config{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px 10px;margin:8px 0 11px}
.field{font-size:11px;gap:3px}
.field input,.field select{height:30px;padding:4px 7px;font-size:12px}
.field.row{align-self:center}
.row{font-size:11px}

.templates.grouped-templates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible;padding:0;scroll-snap-type:none;align-items:stretch;flex-shrink:0}

.grouped-templates .template{flex:none;width:100%;min-width:0;min-height:35px;padding:3px 4px;gap:4px;border-radius:5px;scroll-snap-align:none;line-height:1.15;font-size:10px;text-align:left}
.grouped-templates .template canvas{width:39px;height:30px;border-radius:2px;flex-shrink:0}
.grouped-templates .template span{min-width:0;overflow-wrap:anywhere}
/* Unfilled slots need visible separation even with a zero-pixel output gap.
   The outline is an EDITOR ONLY overlay, never painted to the exported image. */
.tile.unfilled{background:#f4f7fb}
.tile.unfilled::after{content:"";position:absolute;inset:0;border:2px solid #95abc4;pointer-events:none;z-index:1}
.tile.unfilled .empty{z-index:2;color:#677e98;text-shadow:0 1px 0 #fff;font-weight:600}
.tile.unfilled .empty b{color:#648bb3}
.tile.unfilled.active{outline:2px solid #2775d5;outline-offset:-2px;z-index:2}

/* v1.4: prioritize full-size editor preview; templates may flow below viewport.

@media (min-width:720px){
  main{height:auto;min-height:0;align-items:start}
  .panel{overflow:visible;min-height:0}
  .preview-wrap{height:auto;min-height:0;flex:none;padding:8px;overflow:visible}
  .preview{width:100%;height:auto;max-width:100%;max-height:none;flex:0 0 auto}

}
@media (max-width:719px){
  .preview-wrap{height:auto;min-height:0;flex:none;padding:8px}
  .preview{width:100%;height:auto;max-width:100%;max-height:none;flex:0 0 auto}
}

/* v1.5: usable two-column workspace down to 800px viewport width.
   Keep the editor as large as possible; templates may extend below the fold. */
@media (min-width:680px) and (max-width:900px){
  header{padding:0 10px}
  header small{display:none}
  main{
    display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);
    align-items:start;gap:8px;padding:0 8px;margin:8px auto;
    height:auto;min-height:0;
  }
  .panel{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:visible;padding:9px;border-radius:10px}
  .panel h2{font-size:13px}

  .toolbar{gap:5px}
  .btn{font-size:11px;padding:6px 7px}
  .preview-wrap{width:100%;height:auto;min-height:0;flex:none;padding:6px;overflow:hidden}
  .preview{width:100%;height:auto;max-height:none;max-width:100%;flex:none}
  .templates.grouped-templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .template-group{min-width:0}
  .grouped-templates .template{font-size:10px}
  .grouped-templates .template canvas{width:38px;height:29px}
  .result-surface{width:100%;height:clamp(235px,45dvh,430px);min-height:0;flex:none;padding:7px}
  .result-surface img{max-width:100%;max-height:100%}
  .tips{font-size:10px;overflow-wrap:anywhere}

@media(max-width:679px){
  main{display:grid;grid-template-columns:minmax(0,1fr);height:auto;min-height:0;gap:10px;padding:0 9px;margin:8px auto}

.editor-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;flex-wrap:wrap;margin-bottom:8px}
.editor-heading h2{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}

 .editor-heading{gap:5px}
 .editor-heading h2{gap:5px}

<body>
<header><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="7" width="48" height="45" rx="6" fill="#1871c6"/><rect x="9" y="13" width="36" height="32" rx="3" fill="#e5f4ff"/><circle cx="19" cy="22" r="5" fill="#1871c6"/><path d="M10 42l12-13 8 8 7-10 8 11v6H10" fill="#1871c6"/><circle cx="47" cy="46" r="15" fill="#1ea34a" stroke="white" stroke-width="3"/><path d="M38 46l6 6 11-14" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>GridMerge <span style="font-weight:450;color:#6b7f99;font-size:14px">Web</span></div><small>写真の処理は端末内で完結・サーバー送信なし</small></header>
<main>
<section class="panel">
<div class="editor-heading">
  <h2>編集 <span>写真を配置して分割レイアウトを調整</span></h2>
  <div class="editor-actions"><button class="btn" id="white" type="button">＋ 白画像</button><button class="btn" id="clear" type="button">全てクリア</button></div>
</div>
<input id="files" type="file" multiple accept="image/*" hidden>
<div class="preview-wrap"><div id="preview" class="preview" aria-label="画像の配置・トリミング編集エリア"></div></div>
<div class="sub">枠内ドラッグ：写真の位置調整／別の枠へドラッグ：入れ替え／エクスプローラーからドロップ：写真の追加</div>
<h2>分割テンプレート</h2><div id="templates" class="templates grouped-templates" aria-label="分割テンプレートを選択"></div>
<details class="settings-block" id="settings"><summary>出力設定（サイズ・余白・形式など）</summary>
<div class="config">
<label class="field">画像の横幅（px）<input id="width" type="number" min="100" max="10000" value="2000"></label>
<label class="field">画像の縦幅（px）<input id="height" type="number" min="100" max="10000" value="1500"></label>
<label class="field">写真の間隔（px）<input id="gap" type="number" min="0" max="200" value="3"></label>
<label class="field">出力形式<select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label>
<label class="row"><input type="checkbox" id="cover" checked> 枠いっぱいに拡大・中央トリミング</label>
<label class="row"><input type="checkbox" id="upscale" checked> 小さい画像を拡大する</label>
<label class="row"><input type="checkbox" id="lock" checked> 縦横比を固定する</label>
<label class="field">保存ファイル名<input id="filename" value="GridMerge" maxlength="100"></label>
</div>
</details>
</section>
<aside class="panel">
<h2>生成結果 <span>画像をドラッグして保存</span></h2>
<div class="toolbar"><button class="btn primary" id="generate">画像を生成</button><span id="outputInfo" class="muted" style="font-size:12px"></span></div>
<div class="result-surface" id="resultSurface"><div class="placeholder" id="resultPlaceholder"><strong>▧</strong><div>写真を配置して「画像を生成」</div><div>生成結果がここに表示されます</div></div><img id="result" alt="生成した結合画像。エクスプローラーへドラッグできます" draggable="true" style="display:none"></div>
<div class="downloadbar"><button class="btn" id="chooseFolder" type="button">📁 保存フォルダを指定</button><button class="btn" id="clearFolder" type="button" hidden>指定解除</button><span class="folder-state" id="folderState">保存先未指定（生成後は通常の保存が使えます）</span></div>
<div class="downloadbar"><button class="btn" id="download" disabled>↓ 通常の保存</button><span class="hint">保存フォルダ指定時は「画像を生成」で直接保存。未指定なら従来どおり</span></div>
<div class="status" id="status" role="status">画像は外部サーバーへ送信しません。</div>
</aside>
</main>
<div class="dropcover" id="dropcover">画像を枠の上へドロップ</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), templateBox=$('#templates'), preview=$('#preview'), result=$('#result'), status=$('#status');
const T=[
{name:'2分割｜左右',ratio:[4,3],rects:[[0,0,.5,1],[.5,0,.5,1]]},
{name:'2分割｜上下',ratio:[3,4],rects:[[0,0,1,.5],[0,.5,1,.5]]},
{name:'3分割｜1＋2',ratio:[4,3],rects:[[0,0,.5,1],[.5,0,.5,.5],[.5,.5,.5,.5]]},
{name:'3分割｜2＋1',ratio:[4,3],rects:[[0,0,.5,.5],[0,.5,.5,.5],[.5,0,.5,1]]},
{name:'3分割｜上1+下2*',ratio:[8,9],rects:[[0,0,1,2/3],[0,2/3,.5,1/3],[.5,2/3,.5,1/3]]},
	{name:'3分割｜上1＋下2',ratio:[4,5],rects:[[0,0,1,3/5],[0,3/5,.5,2/5],[.5,3/5,.5,2/5]]},
{name:'4分割｜2×2（横）',ratio:[4,3],rects:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]]},
{name:'4分割｜2×2（縦）',ratio:[3,4],rects:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]]},
{name:'6分割｜3×2',ratio:[4,3],rects:Array.from({length:6},(_,i)=>[(i%3)/3,Math.floor(i/3)/2,1/3,1/2])},
{name:'6分割｜2×3',ratio:[3,4],rects:Array.from({length:6},(_,i)=>[(i%2)/2,Math.floor(i/2)/3,1/2,1/3])},
{name:'9分割｜3×3',ratio:[4,3],rects:Array.from({length:9},(_,i)=>[(i%3)/3,Math.floor(i/3)/3,1/3,1/3])},
];
let template=0, slots=[], selected=0, generatedBlob=null, generatedURL=null, outputName='', lockUpdating=false, dragState=null;
function say(msg){status.textContent=msg}
function number(id,fallback,min,max){const v=Number($(id).value);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):fallback}
function invalidate(){if(generatedURL)URL.revokeObjectURL(generatedURL);generatedURL=null;generatedBlob=null;result.removeAttribute('src');result.style.display='none';$('#resultPlaceholder').style.display='';$('#download').disabled=true;$('#outputInfo').textContent=''}
function chosenTemplate(){return T[template]}
function setTemplate(i){template=i;const t=chosenTemplate();const previous=slots;slots=t.rects.map((_,j)=>previous[j]||null);selected=Math.min(selected,slots.length-1);for(const b of templateBox.querySelectorAll('.template'))b.classList.toggle('active',Number(b.dataset.templateIndex)===i);if($('#lock').checked){$('#height').value=Math.round(number('#width',2000,100,10000)*t.ratio[1]/t.ratio[0])}invalidate();render()}
function makeThumb(t){const c=document.createElement('canvas');c.width=148;c.height=110;const ctx=c.getContext('2d');const r=t.ratio[0]/t.ratio[1];const W=Math.min(140,105*r),H=W/r,left=(148-W)/2,top=(110-H)/2;ctx.fillStyle='#d7e4f3';for(let j=0;j<t.rects.length;j++){const [x,y,w,h]=t.rects[j];ctx.fillRect(left+x*W+1,top+y*H+1,w*W-2,h*H-2);ctx.fillStyle='#a6bad1';ctx.fillRect(left+x*W+6,top+y*H+6,Math.max(w*W-12,4),Math.max(h*H-12,4));ctx.fillStyle='#d7e4f3'}return c}
const templateGroups=[
  {title:'2分割',indices:[0,1]},
  {title:'3分割',indices:[2,3,4,5]},
  {title:'4分割',indices:[6,7]},
  {title:'その他',indices:[8,9,10]}
];
for(const group of templateGroups){
  const column=document.createElement('div');column.className='template-group';
  const heading=document.createElement('div');heading.className='template-group-title';heading.textContent=group.title;column.appendChild(heading);
  const variants=document.createElement('div');variants.className='template-variants';
  for(const i of group.indices){
    const t=T[i],b=document.createElement('button');b.className='template';b.type='button';b.dataset.templateIndex=i;
    b.appendChild(makeThumb(t));const label=document.createElement('span');
    label.textContent=t.name.split('｜')[1]||t.name;
    b.appendChild(label);b.title=t.name;b.setAttribute('aria-label',t.name);
    b.addEventListener('click',()=>setTemplate(i));variants.appendChild(b);
  }
  column.appendChild(variants);templateBox.appendChild(column);
}
function getPreviewSize(){return [preview.clientWidth,preview.clientHeight]}
function placement(sw,sh,dw,dh,cover,upscale,ox,oy){const scale=cover?Math.max(dw/sw,dh/sh):Math.min(dw/sw,dh/sh);const safeScale=upscale?scale:Math.min(scale,1);const iw=sw*safeScale,ih=sh*safeScale;let x=(dw-iw)/2,y=(dh-ih)/2;const extraX=Math.max(0,iw-dw),extraY=Math.max(0,ih-dh);x-=Math.max(-.5,Math.min(.5,ox||0))*extraX;y-=Math.max(-.5,Math.min(.5,oy||0))*extraY;return {x,y,iw,ih,extraX,extraY}}
function drawSlot(ctx,slot,w,h,cover,upscale){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);if(!slot)return;if(slot.white)return;const img=slot.img;if(!img)return;const p=placement(img.naturalWidth,img.naturalHeight,w,h,cover,upscale,slot.ox,slot.oy);ctx.drawImage(img,p.x,p.y,p.iw,p.ih)}
function render(){const t=chosenTemplate(),[pw,ph]=getPreviewSize(),gap=number('#gap',3,0,200),outW=number('#width',2000,100,10000),outH=number('#height',1500,100,10000);if(pw<1||ph<1)return;preview.style.aspectRatio=outW+'/'+outH;preview.replaceChildren();const cover=$('#cover').checked,upscale=$('#upscale').checked;
t.rects.forEach((r,i)=>{let el=document.createElement('div');el.className='tile'+(i===selected?' active':'')+(!slots[i]?' unfilled':'');el.dataset.index=i;el.style.left=`${r[0]*100}%`;el.style.top=`${r[1]*100}%`;el.style.width=`${r[2]*100}%`;el.style.height=`${r[3]*100}%`;const cv=document.createElement('canvas');const sw=Math.max(1,Math.round((pw*r[2]-gap)*Math.min(devicePixelRatio||1,2))),sh=Math.max(1,Math.round((ph*r[3]-gap)*Math.min(devicePixelRatio||1,2)));cv.width=sw;cv.height=sh;const ctx=cv.getContext('2d');drawSlot(ctx,slots[i],sw,sh,cover,upscale);el.appendChild(cv);if(!slots[i]){const hint=document.createElement('div');hint.className='empty';hint.innerHTML='<b>＋</b>写真を追加';el.appendChild(hint)}let margin=gap/2;el.style.borderWidth=`${margin}px`;el.addEventListener('pointerdown',e=>pointerDown(e,i,el));el.addEventListener('pointermove',e=>pointerMove(e,i,el));el.addEventListener('pointerup',e=>pointerUp(e,i,el));el.addEventListener('pointercancel',()=>dragState=null);el.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files')){e.preventDefault();el.classList.add('drag-target')}});el.addEventListener('dragleave',()=>el.classList.remove('drag-target'));el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drag-target');const f=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(f.length)assignFiles(f,i)});preview.appendChild(el)})}
function pointerDown(e,i,el){if(e.button!==0)return;selected=i;for(const tile of preview.children)tile.classList.toggle('active',Number(tile.dataset.index)===i);const r=el.getBoundingClientRect();dragState={idx:i,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,el,sw:r.width,sh:r.height,moved:false};el.setPointerCapture(e.pointerId)}
function pointerMove(e,i,el){if(!dragState||dragState.idx!==i)return;const d=dragState;const dx=e.clientX-d.startX,dy=e.clientY-d.startY;if(Math.hypot(dx,dy)>5)d.moved=true;const s=slots[i];if(s&&!s.white&&s.img){const cover=$('#cover').checked,upscale=$('#upscale').checked,p=placement(s.img.naturalWidth,s.img.naturalHeight,d.sw,d.sh,cover,upscale,s.ox,s.oy);if(p.extraX>0)s.ox=Math.max(-.5,Math.min(.5,(s.ox||0)-(e.clientX-d.lastX)/p.extraX));if(p.extraY>0)s.oy=Math.max(-.5,Math.min(.5,(s.oy||0)-(e.clientY-d.lastY)/p.extraY));if(p.extraX>0||p.extraY>0){drawSlot(el.querySelector('canvas').getContext('2d'),s,el.querySelector('canvas').width,el.querySelector('canvas').height,cover,upscale);invalidate()}}d.lastX=e.clientX;d.lastY=e.clientY}
function pointerUp(e,i,el){if(!dragState)return;const d=dragState;dragState=null;const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(dest&&dest!==el&&preview.contains(dest)&&d.moved){const j=Number(dest.dataset.index);[slots[i],slots[j]]=[slots[j],slots[i]];selected=j;invalidate();render()}else if(!d.moved&&!slots[i])$('#files').click();else render()}
async function decodeFile(file){if(!file.type.startsWith('image/'))throw Error('画像ファイルを選択してください');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();return {img,white:false,ox:0,oy:0,fileName:file.name}}finally{URL.revokeObjectURL(url)}}
async function assignFiles(files,index){let at=index;let success=0;for(const file of files){while(at<slots.length&&slots[at]&&at!==index)at++;if(at>=slots.length)break;try{slots[at]=await decodeFile(file);success++}catch(err){say(file.name+' を読み込めませんでした: '+err.message)}at++}selected=Math.min(index,slots.length-1);invalidate();render();if(success)say(success+'枚の画像を配置しました')}
$('#files').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(files.length)await assignFiles(files,selected)});$('#white').onclick=()=>{slots[selected]={white:true};invalidate();render();say('白画像を配置しました')};$('#clear').onclick=()=>{slots=slots.map(()=>null);invalidate();render();say('すべての枠をクリアしました')};
function syncRatio(changed){if(!$('#lock').checked||lockUpdating)return;lockUpdating=true;const [rw,rh]=chosenTemplate().ratio;const v=number('#'+changed,changed==='width'?2000:1500,100,10000);if(changed==='width')$('#height').value=Math.round(v*rh/rw);else $('#width').value=Math.round(v*rw/rh);lockUpdating=false}
for(const id of ['width','height','gap','cover','upscale'])$('#'+id).addEventListener('input',()=>{if(id==='width'||id==='height')syncRatio(id);invalidate();render()});$('#lock').addEventListener('change',()=>{syncRatio('width');invalidate();render()});$('#format').addEventListener('change',invalidate);$('#filename').addEventListener('input',()=>{if(generatedBlob)outputName=getFileName()});
function getFileName(){let name=($('#filename').value||'GridMerge').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim()||'GridMerge';const stamp=new Date();const pad=n=>('0'+n).slice(-2);return name+'_'+stamp.getFullYear()+'-'+pad(stamp.getMonth()+1)+'-'+pad(stamp.getDate())+'_'+pad(stamp.getHours())+pad(stamp.getMinutes())+pad(stamp.getSeconds())+($('#format').value==='image/png'?'.png':'.jpg')}
// 保存先のフォルダハンドルは IndexedDB に保存します。画像本体は保存しません。
let saveDirectory=null;
const folderLabel=$('#folderState');
const folderButton=$('#chooseFolder');
const folderClear=$('#clearFolder');
const supportsFolderPicker=typeof window.showDirectoryPicker==='function' && window.isSecureContext;
function updateFolderUI(){
  folderLabel.classList.toggle('folder-ready',!!saveDirectory);
  folderLabel.textContent=saveDirectory?'保存先：'+saveDirectory.name+'（生成時に自動保存。権限の再確認が必要な場合があります）':
    (supportsFolderPicker?'保存先未指定（画像生成後は通常の保存も利用可能）':'このブラウザはフォルダへの直接保存に非対応です');
  folderClear.hidden=!saveDirectory;
  folderButton.textContent=saveDirectory?'📁 保存フォルダを変更':'📁 保存フォルダを指定';
  folderButton.disabled=!supportsFolderPicker;
}
function openFolderDB(){return new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error('IndexedDB が使用できません'));return}
  const req=indexedDB.open('gridmerge-web-preferences',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('settings'))req.result.createObjectStore('settings')};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
})}
async function directoryStore(operation,handle){
  const db=await openFolderDB();try{return await new Promise((resolve,reject)=>{
    const tx=db.transaction('settings',operation==='read'?'readonly':'readwrite');
    const store=tx.objectStore('settings');
    const request=operation==='read'?store.get('saveDirectory'):operation==='delete'?store.delete('saveDirectory'):store.put(handle,'saveDirectory');
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
  })}finally{db.close()}
}
(async()=>{try{const saved=await directoryStore('read');if(saved&&saved.kind==='directory')saveDirectory=saved}catch(e){console.warn('保存先設定の復元に失敗:',e)}updateFolderUI()})();
folderButton.addEventListener('click',async()=>{
  if(!supportsFolderPicker){say('フォルダ指定はWindows版Chrome / Edgeなど対応ブラウザで利用できます。');return}
  try{
    const selected=await window.showDirectoryPicker({mode:'readwrite',id:'gridmerge-output'});
    saveDirectory=selected;
    try{await directoryStore('write',selected)}catch(e){console.warn('フォルダ設定を記憶できませんでした',e)}
    updateFolderUI();say('保存先を「'+selected.name+'」に設定しました。生成するとこのフォルダに保存します。');
  }catch(e){if(e.name!=='AbortError')say('フォルダを設定できませんでした: '+e.message)}
});
folderClear.addEventListener('click',async()=>{saveDirectory=null;updateFolderUI();try{await directoryStore('delete')}catch(e){console.warn(e)}say('保存先の指定を解除しました')});
async function ensureDirectoryPermission(handle){
  const opts={mode:'readwrite'};
  if(await handle.queryPermission(opts)==='granted')return true;
  return await handle.requestPermission(opts)==='granted';
}
async function saveBlobInDirectory(handle,blob,name){
  const fileHandle=await handle.getFileHandle(name,{create:true});
  const writable=await fileHandle.createWritable();
  try{await writable.write(blob);await writable.close()}catch(e){try{await writable.abort()}catch(_){}throw e}
}
$('#generate').onclick=async()=>{
  let approvedDirectory=null;
  if(saveDirectory){
    try{if(await ensureDirectoryPermission(saveDirectory))approvedDirectory=saveDirectory;
      else say('保存フォルダへのアクセスが許可されませんでした。画像は生成しますが自動保存は行いません。');
    }catch(e){say('保存先へのアクセス確認に失敗しました: '+e.message)}
  }
  const W=number('#width',2000,100,10000),H=number('#height',1500,100,10000);if(W*H>70000000){say('生成画像が大きすぎます。70メガピクセル以下にしてください');return}const can=document.createElement('canvas');try{can.width=W;can.height=H;const ctx=can.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const cover=$('#cover').checked,upscale=$('#upscale').checked,gap=number('#gap',3,0,200);chosenTemplate().rects.forEach(([x,y,w,h],i)=>{const left=Math.round(x*W),top=Math.round(y*H),right=Math.round((x+w)*W),bottom=Math.round((y+h)*H);const sx=left+Math.ceil(gap/2),sy=top+Math.ceil(gap/2),sw=Math.max(1,right-left-gap),sh=Math.max(1,bottom-top-gap);ctx.save();ctx.beginPath();ctx.rect(sx,sy,sw,sh);ctx.clip();ctx.translate(sx,sy);drawSlot(ctx,slots[i],sw,sh,cover,upscale);ctx.restore()});const type=$('#format').value;const blob=await new Promise(resolve=>can.toBlob(resolve,type,.93));if(!blob)throw Error('画像の生成に失敗しました');invalidate();generatedBlob=blob;generatedURL=URL.createObjectURL(blob);outputName=getFileName();result.src=generatedURL;result.style.display='block';$('#resultPlaceholder').style.display='none';$('#download').disabled=false;$('#outputInfo').textContent=`${W} × ${H} px / ${(blob.size/1024/1024).toFixed(2)} MB`;if(approvedDirectory){
  try{await saveBlobInDirectory(approvedDirectory,blob,outputName);say('画像を生成し「'+approvedDirectory.name+'」に '+outputName+' を保存しました。')}catch(e){say('画像は生成しましたが、フォルダへの自動保存に失敗しました: '+e.message+'。「通常の保存」を使用してください。')}
}else if(saveDirectory){say('画像を生成しました。保存先へのアクセスを許可できなかったため、下の「通常の保存」をご利用ください。')}
else{say('画像を生成しました。保存フォルダを指定すると次回から生成時に自動保存します。')}}catch(err){say('生成エラー: '+err.message)}};
$('#download').onclick=()=>{if(!generatedURL)return;const a=document.createElement('a');a.href=generatedURL;a.download=outputName||getFileName();document.body.appendChild(a);a.click();a.remove()};
result.addEventListener('dragstart',e=>{if(!generatedBlob||!generatedURL){e.preventDefault();return}const filename=outputName||getFileName();const mime=generatedBlob.type||'image/png';e.dataTransfer.effectAllowed='copy';try{const f=new File([generatedBlob],filename,{type:mime});e.dataTransfer.items.add(f)}catch(_){}try{e.dataTransfer.setData('DownloadURL',`${mime}:${filename}:${generatedURL}`)}catch(_){}try{e.dataTransfer.setData('text/uri-list',generatedURL)}catch(_){}say('エクスプローラーへドロップしてください。ブラウザの制約で保存できなければ「通常の保存」を使用してください。')});
window.addEventListener('resize',render);if(window.ResizeObserver){const ro=new ResizeObserver(()=>{requestAnimationFrame(()=>render())});ro.observe(preview)}preview.addEventListener('dragover',e=>e.preventDefault());preview.addEventListener('drop',e=>{e.preventDefault();if(!e.target.closest('.tile'))assignFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')),selected)});
setTemplate(0);
})();
</script>
